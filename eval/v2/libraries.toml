# The M6 benchmark's libraries: six per ecosystem of the frozen set (zenodotus-design/v2/research.md B1).
# `tags` are Stack Overflow tags, all of which a question must carry; `docs` are the documentation hosts (and
# optional path prefixes) an accepted answer must link to for its question to count. The list was fixed before any
# question was fetched and before any v2 ranking or resolution code existed.

