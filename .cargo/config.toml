[alias]
xtask = "run --quiet -p xtask --"
# The coverage gate. Its only exclusion is xtask/src/perf.rs, which drives cargo, GNU time, hyperfine and a network
# download of the performance corpus, and parses `zenodotus status` and the `time -v` report for documents per CPU
# second, failing the run when it cannot; its output is reviewed in every perf report.
coverage = "llvm-cov --workspace --fail-under-lines 100 --fail-under-functions 100 --ignore-filename-regex xtask/src/perf\\.rs"
