[package]
name = "zenodotus-lockfile"
description = "Lockfile, manifest and runtime version file readers for zenodotus project context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4.21"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
zenodotus-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
