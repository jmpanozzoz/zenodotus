[package]
name = "zenodotus-ingest"
description = "Documentation sources, secure fetching, parsing and sectioning for zenodotus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
dom_query = { version = "0.29.0", features = ["markdown"] }
dom_smoothie = "0.19.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
globset = "0.4.21"
pulldown-cmark = { version = "0.13.6", default-features = false }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip"] }
tar = "0.4.46"
texting_robots = "0.2.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "net"] }
tracing = "0.1.44"
url = "2.5.8"
zenodotus-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util", "io-util"] }
wiremock = "0.6.5"
