[package]
name = "zenodotus-mcp"
description = "MCP server (stdio and Streamable HTTP) for zenodotus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "io-std"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["limit"] }
tracing = "0.1.44"
zenodotus-core = { version = "0.1.0", path = "../core" }
zenodotus-search = { version = "0.1.0", path = "../search" }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "=3.11.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
