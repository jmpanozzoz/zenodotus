[package]
name = "zenodotus-search"
description = "Tantivy-backed storage, ranking and retrieval for zenodotus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
thiserror = "2.0.21"
zenodotus-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "query"
harness = false

[[bench]]
name = "index"
harness = false
