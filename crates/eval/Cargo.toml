[package]
name = "zenodotus-eval"
description = "Evaluation and competitor comparison harness for zenodotus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
rmcp = { version = "=3.11.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "1.2.1"
url = "2.5.8"
zenodotus-core = { version = "0.1.0", path = "../core" }
zenodotus-search = { version = "0.1.0", path = "../search" }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
