# Hand-written sample of a pyproject.toml with PEP 621, PEP 735 and Poetry tables.
[project]
name = "demo"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "Pydantic[email] ~= 2.7 ; python_version >= '3.10'",
    "local-lib @ file:///srv/local-lib",
    "   ",
]

[project.optional-dependencies]
server = ["uvicorn[standard]"]

[dependency-groups]
test = ["pytest>=8", { include-group = "lint" }]
lint = ["ruff"]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32"
widget = { git = "https://github.com/acme/widget.git" }
local = { path = "../local" }
httpx = { version = "^0.27", extras = ["http2"] }

[tool.poetry.dev-dependencies]
black = "^24.4"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
